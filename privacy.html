    <h1>개인정보 처리방침</h1>
    <p>서해낚시맵은 회원가입, 결제, 댓글 기능을 제공하지 않으며 별도의 개인정보를 저장하지 않습니다.</p>
    <ul>
      <li>검색어와 필터 선택값은 브라우저 화면 표시용으로만 사용됩니다.</li>
      <li>현장 해양 예보 조회 시 선택한 포인트의 좌표가 Open-Meteo API 요청에 포함됩니다.</li>
      <li>지도, 조석예보, 관광정보 링크를 열면 해당 외부 서비스의 개인정보 정책이 적용됩니다.</li>
      <li>문의나 삭제 요청이 필요한 경우 GitHub 저장소 관리자에게 연락해 주세요.</li>
    </ul>
